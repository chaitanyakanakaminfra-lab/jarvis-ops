apiVersion: v1
kind: Service
metadata:
  name: jarvis-orchestrator
  namespace: jarvis
  labels:
    app: jarvis
    component: orchestrator
spec:
  selector:
    app: jarvis
    component: orchestrator
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: https
      port: 443
      targetPort: 8000
  type: LoadBalancer

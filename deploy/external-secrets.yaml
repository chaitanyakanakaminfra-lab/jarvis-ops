apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jarvis-secrets
  namespace: jarvis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: jarvis-secrets
    creationPolicy: Owner
  data:
    - secretKey: groq_api_key
      remoteRef:
        key: jarvis/groq
        property: api_key
    - secretKey: github_token
      remoteRef:
        key: jarvis/github
        property: token

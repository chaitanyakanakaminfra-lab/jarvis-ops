# agents/cicd/workflows/build.yaml
# Argo WorkflowTemplate — Build + Test pipeline
#
# Interview explanation:
#   "This WorkflowTemplate runs a standard build pipeline:
#    checkout code, run lint, run tests, build Docker image.
#    Each step is a separate container — Kubernetes-native,
#    fully observable in the Argo UI."

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: jarvis-build
  namespace: jarvis
  labels:
    app: jarvis
    agent: cicd
spec:
  entrypoint: build-pipeline
  serviceAccountName: jarvis-workflow-sa

  arguments:
    parameters:
      - name: repo_url
        value: "https://github.com/chaitanyakanakaminfra-lab/jarvis-ops"
      - name: branch
        value: "main"
      - name: pr_number
        value: ""

  templates:
    - name: build-pipeline
      steps:
        - - name: checkout
            template: git-checkout
        - - name: lint
            template: run-lint
        - - name: test
            template: run-tests
        - - name: build-image
            template: docker-build

    - name: git-checkout
      container:
        image: alpine/git:latest
        command: [sh, -c]
        args:
          - |
            git clone {{workflow.parameters.repo_url}} /workspace
            cd /workspace
            if [ -n "{{workflow.parameters.pr_number}}" ]; then
              git fetch origin pull/{{workflow.parameters.pr_number}}/head:pr-branch
              git checkout pr-branch
            fi
            echo "Checkout complete"
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: run-lint
      container:
        image: python:3.12-slim
        command: [sh, -c]
        args:
          - |
            pip install ruff --quiet
            cd /workspace
            ruff check . || true
            echo "Lint complete"
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: run-tests
      container:
        image: python:3.12-slim
        command: [sh, -c]
        args:
          - |
            pip install pytest --quiet
            cd /workspace
            pytest tests/ -v --tb=short || true
            echo "Tests complete"
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: docker-build
      container:
        image: docker:24-dind
        command: [sh, -c]
        args:
          - |
            echo "Building Docker image..."
            docker build -t jarvis-ops:latest /workspace || true
            echo "Build complete"
        volumeMounts:
          - name: workspace
            mountPath: /workspace

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

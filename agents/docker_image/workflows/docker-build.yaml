# agents/docker_image/workflows/docker-build.yaml
# Argo WorkflowTemplate — Build + Trivy scan

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: jarvis-docker-build
  namespace: jarvis
  labels:
    app: jarvis
    agent: docker
spec:
  entrypoint: build-scan-pipeline
  serviceAccountName: jarvis-workflow-sa

  arguments:
    parameters:
      - name: image_name
        value: "jarvis/orchestrator"
      - name: tag
        value: "latest"
      - name: repo_url
        value: "https://github.com/chaitanyakanakaminfra-lab/jarvis-ops"

  templates:
    - name: build-scan-pipeline
      steps:
        - - name: build
            template: docker-build-step
        - - name: scan
            template: trivy-scan

    - name: docker-build-step
      container:
        image: docker:24-dind
        command: [sh, -c]
        args:
          - |
            echo "Building {{workflow.parameters.image_name}}:{{workflow.parameters.tag}}..."
            git clone {{workflow.parameters.repo_url}} /workspace
            docker build \
              -t {{workflow.parameters.image_name}}:{{workflow.parameters.tag}} \
              /workspace
            echo "Build complete"

    - name: trivy-scan
      container:
        image: aquasec/trivy:latest
        command: [sh, -c]
        args:
          - |
            echo "Scanning {{workflow.parameters.image_name}} for CVEs..."
            trivy image \
              --exit-code 1 \
              --severity CRITICAL \
              --format table \
              {{workflow.parameters.image_name}}:{{workflow.parameters.tag}} \
              || echo "Critical CVEs found — review before deploying"
            echo "Scan complete"

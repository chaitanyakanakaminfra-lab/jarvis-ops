version: "3.9"

services:

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: jarvis-orchestrator
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - CHROMA_HOST=chromadb
      - POSTGRES_HOST=postgres
    volumes:
      - ./orchestrator:/app/orchestrator
      - ./agents:/app/agents
      - ./config:/app/config
      - ./memory:/app/memory
      - ./api:/app/api
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    networks:
      - jarvis-net

  voice:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: jarvis-voice
    command: ["python", "-m", "voice.websocket_server"]
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./voice:/app/voice
      - ./orchestrator:/app/orchestrator
    depends_on:
      - orchestrator
    restart: unless-stopped
    networks:
      - jarvis-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: jarvis-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - jarvis-net

  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./memory/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jarvis-net

volumes:
  chroma-data:
  postgres-data:

networks:
  jarvis-net:
    driver: bridge

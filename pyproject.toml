[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-ops"
version = "0.1.0"
description = "Jarvis — Voice-controlled AI DevOps & Infra Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "chaitanyakanakaminfra-lab" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "openai>=1.30.0",
    "pvporcupine>=3.0.0",
    "deepgram-sdk>=3.2.0",
    "elevenlabs>=1.2.0",
    "pyaudio>=0.2.14",
    "sounddevice>=0.4.6",
    "chromadb>=0.5.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "kubernetes>=29.0.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "httpx>=0.27.0",
]

[project.scripts]
jarvis = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = [
    "orchestrator",
    "agents",
    "voice",
    "api",
    "memory",
    "cli",
    "config",
    "triggers",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "*/migrations/*"]

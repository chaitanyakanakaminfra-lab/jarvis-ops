apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-voice
  namespace: jarvis
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jarvis
      component: voice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jarvis
        component: voice
    spec:
      containers:
      - name: voice
        image: 535709430661.dkr.ecr.us-east-1.amazonaws.com/jarvis-voice:latest
        ports:
        - containerPort: 8765
          name: websocket
        - containerPort: 8766
          name: health
        envFrom:
        - secretRef:
            name: jarvis-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8766
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8766
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-voice
  namespace: jarvis
spec:
  selector:
    app: jarvis
    component: voice
  ports:
  - name: websocket
    port: 8765
    targetPort: 8765
  - name: health
    port: 8766
    targetPort: 8766

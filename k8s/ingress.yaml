apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis-ingress
  namespace: jarvis
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:535709430661:certificate/41f7d7f1-3f0c-4856-a723-07290473dc5d
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=4000
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /voice-ws
        pathType: Prefix
        backend:
          service:
            name: jarvis-voice
            port:
              number: 8766
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: jarvis-orchestrator
            port:
              number: 8000
      - path: /agents
        pathType: Prefix
        backend:
          service:
            name: jarvis-orchestrator
            port:
              number: 8000
      - path: /chat
        pathType: Prefix
        backend:
          service:
            name: jarvis-orchestrator
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jarvis-ui
            port:
              number: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-ui
  namespace: jarvis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jarvis-ui
    spec:
      containers:
      - name: ui
        image: 535709430661.dkr.ecr.us-east-1.amazonaws.com/jarvis-ui:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-ui
  namespace: jarvis
spec:
  selector:
    app: jarvis-ui
  ports:
  - port: 80
    targetPort: 80
